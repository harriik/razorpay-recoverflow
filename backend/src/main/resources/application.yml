server:
  port: 8080

spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recoverflow}
    username: ${DATABASE_USER:recoverflow}
    password: ${DATABASE_PASSWORD:recoverflow}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

app:
  demo:
    api-key: ${DEMO_API_KEY:demo-key-change-me}
    merchant-id: ${DEMO_MERCHANT_ID:00000000-0000-0000-0000-000000000001}
